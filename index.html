<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>PIXEL//BATTLE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
    :root { --bg:#08090d; --ink:#f5f4ed; --muted:#999b9b; --bar:#111315; --line:#363a3d; --cyan:#50e6d4; --pink:#ff4eb8; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:var(--ink); background:#08090d; font-family:'VT323',monospace; font-size:21px; letter-spacing:.04em; }
    .game { width:100%; height:100%; position:relative; overflow:hidden; }
    #viewport { position:absolute; inset:0 0 210px; overflow:hidden; cursor:grab; touch-action:none; background:
      radial-gradient(circle at 50% 42%, rgba(38,45,54,.36), transparent 47%),
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px), #08090d;
      background-size:auto, 32px 32px, 32px 32px, auto; }
    #viewport.dragging { cursor:grabbing; }
    .topbar { position:absolute; z-index:4; top:18px; left:22px; right:22px; display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; text-shadow:2px 2px #000; }
    .eyebrow { color:var(--cyan); font-size:16px; letter-spacing:.18em; margin-bottom:9px; }
    h1 { margin:0; font:clamp(20px, 4vw, 35px)/1.3 'Press Start 2P',monospace; text-shadow:4px 4px #702251; }
    .live { pointer-events:auto; color:#8dff9a; font-size:18px; white-space:nowrap; }
    .live::before { content:'●'; margin-right:7px; color:#8dff9a; }
    .live.offline { color:#ffcb68; }.live.offline::before { color:#ffcb68; }
    .mode-tabs { pointer-events:auto; display:flex; gap:4px; padding:4px; background:rgba(20,24,30,.72); border:1px solid rgba(170,190,200,.3); border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.35); backdrop-filter:blur(10px); }
    .mode-tab { padding:9px 13px; color:#9aa5a8; background:transparent; border:0; border-radius:6px; cursor:pointer; font:12px 'Press Start 2P',monospace; }
    .mode-tab:hover, .mode-tab.active { color:#101516; background:var(--cyan); }
    #board-world
 { position:absolute; left:50%; top:50%; width:min(92vw, 1200px); aspect-ratio:2 / 1; transform-origin:center center; will-change:transform; }
    .board-frame { width:100%; height:100%; padding:9px; background-color:#101923; background-image:linear-gradient(rgba(5,7,10,.48),rgba(5,7,10,.48)),url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg'); background-position:center; background-size:cover; background-repeat:no-repeat; border:2px solid #656b70; box-shadow:0 0 0 1px #111, 0 14px 42px #000; }
    .board-frame.gapchuk { background-image:none; background-size:contain; background-position:center; background-repeat:no-repeat; }
    #pixelCanvas { display:block; width:100%; height:100%; background:transparent; image-rendering:crisp-edges; image-rendering:pixelated; cursor:crosshair; user-select:none; }
    #pixelCanvas.cooldown { cursor:wait; }
    #pixelCanvas.flash { animation:canvas-flash .42s steps(2,end); }
    @keyframes canvas-flash { 0%,100% { filter:none; } 35% { filter:brightness(2.4) saturate(.4); } 65% { filter:brightness(1.35); } }
    .zoom-help { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); color:#777d80; font-size:17px; white-space:nowrap; text-shadow:1px 1px #000; }
    #palette-bar { position:fixed; z-index:10; left:0; right:0; bottom:0; height:210px; padding:10px 18px 12px; background:#111315; border-top:2px solid #3d4245; box-shadow:0 -10px 28px rgba(0,0,0,.48); }
    .toolbar { width:min(100%, 1060px); height:100%; margin:auto; display:flex; align-items:flex-start; gap:16px; }
    .toolbar-info { min-width:190px; display:flex; flex-direction:column; gap:3px; }
    .label { color:var(--muted); font-size:16px; text-transform:uppercase; letter-spacing:.12em; }
    #selected-swatch { display:inline-block; width:20px; height:20px; vertical-align:-5px; margin-right:7px; border:2px solid #fff; }
    #selected-name { color:#fff; }
    #cooldown { color:var(--cyan); font-size:18px; }.ready { color:#8dff9a !important; }
    .palette { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:5px; overflow:visible; padding:3px 4px 7px; }
    .color-btn { flex:0 0 34px; width:34px; height:34px; border:2px solid transparent; padding:0; cursor:pointer; background:#222; box-shadow:2px 2px #050505; transition:transform .1s, border-color .1s; }
    .color-btn:hover { transform:translateY(-2px); }
    .color-btn.selected { border-color:#fff; box-shadow:0 0 0 2px var(--pink), 2px 2px #050505; transform:translateY(-2px); }
    .eraser-btn { flex:0 0 74px; height:34px; color:#fff; background:#343a40; border:2px solid #69737b; cursor:pointer; font:12px 'Press Start 2P',monospace; }
    .eraser-btn.selected { color:#111; background:#ffcf5a; border-color:#fff; }
    .toolbar-meta { min-width:155px; color:var(--muted); text-align:right; font-size:17px; }
    #pixel-count { display:block; color:#ddd; }
    #leaderboard { position:fixed; z-index:8; top:86px; right:22px; width:220px; max-height:310px; padding:13px 15px; color:#f5f4ed; background:rgba(17,19,24,.88); border:1px solid #535b60; box-shadow:0 8px 24px rgba(0,0,0,.42); backdrop-filter:blur(8px); }
    #leaderboard h2 { margin:0 0 9px; color:var(--cyan); font:13px/1.4 'Press Start 2P',monospace; }
    #leaderboard ol { margin:0; padding-left:27px; color:#d8dcdb; }
    #leaderboard li { padding:2px 0; font-size:19px; }
    #leaderboard li::marker { color:#ffcf5a; }
    .score { float:right; color:#fff; }
    #nickname-modal { position:fixed; z-index:30; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(3,4,6,.78); }
    #nickname-modal[hidden] { display:none; }
    .modal-card { width:min(100%, 390px); padding:26px; text-align:center; background:#16191d; border:2px solid #687176; box-shadow:10px 10px #050607; }
    .modal-card h2 { margin:0 0 12px; font:18px/1.5 'Press Start 2P',monospace; color:var(--cyan); }
    .modal-card p { margin:0 0 18px; color:#bfc4c4; }
    #nickname-input { width:100%; padding:11px 12px; color:#fff; background:#090a0c; border:2px solid #5b6367; font:22px 'VT323',monospace; outline:none; }
    #nickname-input:focus { border-color:var(--cyan); }
    #nickname-form button { width:100%; margin-top:13px; padding:11px; color:#0b0d0e; background:var(--cyan); border:0; cursor:pointer; font:15px 'Press Start 2P',monospace; }
    #nickname-error { min-height:20px; margin:8px 0 0; color:#ff7777; font-size:17px; }
    @media (max-width:760px) {
      #viewport { bottom:220px; }
      .topbar { left:12px; right:12px; top:12px; }.live { font-size:15px; }.eyebrow { font-size:12px; } h1 { font-size:20px; }
      #palette-bar { height:220px; padding:8px 10px; }.toolbar { display:grid; grid-template-columns:1fr auto; gap:8px 12px; }.toolbar-info { min-width:0; }.toolbar-meta { min-width:0; font-size:15px; }.palette { grid-column:1 / -1; grid-row:2; gap:4px; }.color-btn { flex-basis:30px; width:30px; height:30px; min-width:16px; }
    }
    @media (max-width:420px) { .palette { gap:3px; }.color-btn { flex-basis:28px; width:28px; height:28px; border-width:1px; }.zoom-help { font-size:14px; } }
  </style>
</head>
<body>
  <div id="nickname-modal" hidden>
    <form id="nickname-form" class="modal-card">
      <h2>WELCOME, PIXEL PILOT</h2>
      <p>Enter your nickname to play</p>
      <input id="nickname-input" name="nickname" maxlength="20" autocomplete="nickname" required placeholder="Your nickname" />
      <button type="submit">START PAINTING</button>
      <div id="nickname-error" aria-live="polite"></div>
    </form>
  </div>

  <section id="leaderboard" aria-label="Leaderboard">
    <h2>TOP 10 PLAYERS</h2>
    <ol id="leaderboard-list"><li>Waiting for players…</li></ol>
  </section>

  <main class="game">
    <section id="viewport" aria-label="Infinite pixel canvas">
      <div class="topbar"><div><div class="eyebrow">/// GLOBAL CANVAS 001</div><h1>PIXEL//BATTLE</h1></div><nav class="mode-tabs" aria-label="Canvas modes"><button class="mode-tab active" data-mode="world" type="button">WORLD MAP</button><button class="mode-tab" data-mode="gapchuk" type="button">MR. GAPCHUK</button></nav><div id="connection" class="live offline">LOCAL MODE</div></div>
      <div id="board-world"><div class="board-frame"><canvas id="pixelCanvas" width="1000" height="500" aria-label="1000 by 500 pixel world map"></canvas></div></div>
      <div class="zoom-help">DRAG TO PAN · SCROLL TO ZOOM · CLICK TO PAINT</div>
    </section>

    <aside id="palette-bar" aria-label="Pixel color toolbar">
      <div class="toolbar">
        <div class="toolbar-info"><div class="label">COLOR <span id="selected-swatch"></span><span id="selected-name">NEON PINK</span></div><div id="cooldown" class="ready">● READY</div></div>
        <div id="palette" class="palette" aria-label="Expanded pixel palette"></div>
        <div class="toolbar-meta"><span id="pixel-count">0 PIXELS PAINTED</span><span>1000 × 500 WORLD</span></div>
      </div>
    </aside>
  </main>

    let selectedColor = colors[23].hex, coolingDown = false, renderedOnce = false, scale = 1, panX = 0, panY = 0, dragging = false, dragMoved = false, primaryPointer = false, startX = 0, startY = 0, startPanX = 0, startPanY = 0;

    function applyTransform() { boardWorld.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`; }
    function flashCanvas() { pixelCanvas.classList.remove('flash'); void pixelCanvas.offsetWidth; pixelCanvas.classList.add('flash'); }
    function renderPixels(data = {}) {
      // Clear first so pixels removed from Firebase become transparent again.
      ctx.clearRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
      let painted = 0;
      for (const [key, value] of Object.entries(data)) {
        const [x, y] = key.split('_').map(Number);
        if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) continue;
        if (!value || typeof value.color !== 'string') continue;
        ctx.fillStyle = value.color;
        ctx.fillRect(x, y, 1, 1);
        painted++;
      }
      if (renderedOnce) flashCanvas();
      renderedOnce = true;
      countEl.textContent = `${painted} PIXEL${painted === 1 ? '' : 'S'} PAINTED`;
    }
    function setSelected(color) { eraserSelected = false; if (eraserButton) eraserButton.classList.remove('selected'); selectedColor = color.hex; swatch.style.backgroundColor = color.hex; selectedName.textContent = color.name; document.querySelectorAll('.color-btn').forEach(btn => btn.classList.toggle('selected', btn.dataset.color === color.hex)); }
    function startCooldown() {
      if (isAdmin) return;
      coolingDown = true; pixelCanvas.classList.add('cooldown'); let seconds = 3; cooldownEl.className = ''; cooldownEl.textContent = `WAIT ${seconds}.0s`;
      const timer = setInterval(() => { seconds--; cooldownEl.textContent = seconds ? `WAIT ${seconds}.0s` : '● READY'; if (!seconds) { clearInterval(timer); coolingDown = false; cooldownEl.className = 'ready'; pixelCanvas.classList.remove('cooldown'); } }, 1000);
    }
    async function paint(x, y) {
      if (coolingDown && !isAdmin) return;
      if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT) return;
      const key = `${x}_${y}`;
      if (eraserSelected && isAdmin) ctx.clearRect(x, y, 1, 1);
      else { ctx.fillStyle = selectedColor; ctx.fillRect(x, y, 1, 1); }
      flashCanvas();
      if (!isAdmin) startCooldown();
      if (window.pixelDb) {
        try {
          if (eraserSelected && isAdmin) await remove(ref(window.pixelDb, `${activePixelPath}/${key}`));
          else {
            await set(ref(window.pixelDb, `${activePixelPath}/${key}`), { color: selectedColor });
            await incrementScore();
          }
        } catch (error) {
          console.error(error); connectionEl.textContent = 'SYNC ERROR'; connectionEl.classList.add('offline');
        }
      }
    }

    function renderLeaderboard(data = {}) {
      const entries = Object.entries(data)
        .map(([name, value]) => ({ name, score: Number(value?.score ?? value) || 0 }))
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
        .slice(0, 10);
      leaderboardList.replaceChildren();
      if (!entries.length) { leaderboardList.innerHTML = '<li>Waiting for players…</li>'; return; }
      entries.forEach(({ name, score }) => {
        const item = document.createElement('li');
        item.textContent = name === 'GasunAbmin666' ? 'PapaKriper2004' : name;
        const scoreEl = document.createElement('span'); scoreEl.className = 'score'; scoreEl.textContent = score;
        item.append(scoreEl); leaderboardList.append(item);
      });
    }

    async function incrementScore() {
      if (!window.pixelDb || !username) return;
      const scoreRef = ref(window.pixelDb, `leaderboard/${username}`);
      await runTransaction(scoreRef, (current) => ({ score: (current?.score || 0) + 1 }));
    }

    function addAdminTools() {
      if (!isAdmin || eraserButton) return;
      eraserButton = document.createElement('button');
      eraserButton.type = 'button'; eraserButton.className = 'eraser-btn'; eraserButton.textContent = 'ERASER';
      eraserButton.title = 'Admin eraser';
      eraserButton.addEventListener('click', () => {
        eraserSelected = true; eraserButton.classList.add('selected');
        document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
        selectedName.textContent = 'ERASER'; swatch.style.backgroundColor = '#111';
      });
      palette.append(eraserButton);
      cooldownEl.textContent = '● ADMIN READY'; cooldownEl.className = 'ready';
    }
    function updateAdminState() {
      isAdmin = username === 'GasunAbmin666';
      window.isAdmin = isAdmin;
      if (isAdmin) addAdminTools();
    }
    function setupNickname() {
      updateAdminState();
      if (username) { nicknameModal.hidden = true; return; }
      nicknameModal.hidden = false; nicknameInput.focus();
    }
    nicknameForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const entered = [...nicknameInput.value.trim()].filter(char => !'.#$[]/'.includes(char)).join('').slice(0, 20);
      if (!entered) { nicknameError.textContent = 'Please enter a valid nickname.'; return; }
      username = entered; localStorage.setItem('username', username); updateAdminState(); nicknameModal.hidden = true;
    });

    function subscribeToActivePixels() {
      if (pixelsUnsubscribe) { pixelsUnsubscribe(); pixelsUnsubscribe = null; }
      ctx.clearRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
      renderedOnce = false;
      if (!window.pixelDb) return;
      const pixelsRef = ref(window.pixelDb, activePixelPath);
      connectionEl.textContent = `LOADING ${activePixelPath.toUpperCase()}...`;
      pixelsUnsubscribe = onValue(pixelsRef, (snapshot) => {
        const pixels = snapshot.exists() ? snapshot.val() : {};
        renderPixels(pixels);
        connectionEl.textContent = 'LIVE ONLINE';
        connectionEl.classList.remove('offline');
      }, (error) => {
        console.error(`Could not load /${activePixelPath}:`, error);
        connectionEl.textContent = 'SYNC ERROR';
        connectionEl.classList.add('offline');
      });
    }

    function switchMode(mode) {
      const isGapchuk = mode === 'gapchuk';
      activePixelPath = isGapchuk ? 'gapchuk_pixels' : 'pixels';
      modeTabs.forEach(tab => tab.classList.toggle('active', tab.dataset.mode === mode));
      boardFrame.classList.toggle('gapchuk', isGapchuk);

      // Apply the mode background directly to the canvas parent so it remains
      // visible beneath the transparent canvas in every browser.
      pixelCanvas.style.backgroundColor = 'transparent';
      if (isGapchuk) {
        boardFrame.style.backgroundImage = `url("${GAPCHUK_IMAGE_URL}")`;
        boardFrame.style.backgroundSize = 'contain';
        boardFrame.style.backgroundPosition = 'center';
        boardFrame.style.backgroundRepeat = 'no-repeat';
      } else {
        // Clear the inline override and restore the CSS World Map background.
        boardFrame.style.backgroundImage = '';
        boardFrame.style.backgroundSize = '';
        boardFrame.style.backgroundPosition = '';
        boardFrame.style.backgroundRepeat = '';
      }

      ctx.clearRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
      renderedOnce = false;
      subscribeToActivePixels();
    }
    modeTabs.forEach(tab => {
      tab.addEventListener('pointerdown', event => event.stopPropagation());
      tab.addEventListener('click', () => switchMode(tab.dataset.mode));
    });

    // Firebase logic: the active mode owns one detachable onValue listener.
    function setupFirebase() {
      const configured = firebaseConfig.apiKey &&
        !firebaseConfig.apiKey.startsWith('PASTE_') &&
        !firebaseConfig.projectId.startsWith('PASTE_');
      if (!configured) return;

      try {
        const app = initializeApp(firebaseConfig);
        window.pixelDb = getDatabase(app);
        subscribeToActivePixels();

        onValue(ref(window.pixelDb, 'leaderboard'), (snapshot) => {
          renderLeaderboard(snapshot.exists() ? snapshot.val() : {});
        }, (error) => {
          console.error('Could not load /leaderboard:', error);
        });
      } catch (error) {
        console.error('Firebase initialization failed:', error);
        connectionEl.textContent = 'SYNC ERROR';
      }
    }

    viewport.addEventListener('pointerdown', (event) => { primaryPointer = event.button === 0; dragging = true; dragMoved = false; startX = event.clientX; startY = event.clientY; startPanX = panX; startPanY = panY; viewport.classList.add('dragging'); viewport.setPointerCapture(event.pointerId); });
    viewport.addEventListener('pointermove', (event) => { if (!dragging) return; const dx = event.clientX - startX, dy = event.clientY - startY; if (Math.hypot(dx,dy) > 4) dragMoved = true; panX = startPanX + dx; panY = startPanY + dy; applyTransform(); });
    function paintAtClientPoint(clientX, clientY) {
      const rect = pixelCanvas.getBoundingClientRect();
      const x = Math.floor(((clientX - rect.left) / rect.width) * WORLD_WIDTH);
      const y = Math.floor(((clientY - rect.top) / rect.height) * WORLD_HEIGHT);
      paint(x, y);
    }
    viewport.addEventListener('pointerup', (event) => {
      const hit = document.elementFromPoint(event.clientX, event.clientY);
      const shouldPaint = primaryPointer && !dragMoved && (hit === pixelCanvas || pixelCanvas.contains(hit));
      dragging = false; primaryPointer = false; viewport.classList.remove('dragging');
      if (shouldPaint) paintAtClientPoint(event.clientX, event.clientY);
      setTimeout(() => { dragMoved = false; }, 0);
    });
    viewport.addEventListener('pointercancel', () => { dragging = false; primaryPointer = false; viewport.classList.remove('dragging'); });
    viewport.addEventListener('wheel', (event) => {
      event.preventDefault();
      const oldScale = scale;
      // Exponential scaling feels consistent across mouse wheels and trackpads.
      const zoomFactor = Math.exp(-event.deltaY * 0.0015);
      scale = Math.max(0.45, Math.min(50, scale * zoomFactor));
      const rect = boardWorld.getBoundingClientRect();
      const cx = event.clientX - (rect.left + rect.width / 2), cy = event.clientY - (rect.top + rect.height / 2);
      panX -= cx * (scale / oldScale - 1);
      panY -= cy * (scale / oldScale - 1);
      applyTransform();
    }, { passive:false });
    colors.forEach(color => { const button = document.createElement('button'); button.className = 'color-btn'; button.type = 'button'; button.dataset.color = color.hex; button.title = color.name; button.setAttribute('aria-label', color.name); button.style.backgroundColor = color.hex; button.addEventListener('click', () => setSelected(color)); palette.append(button); });
    pixelCanvas.style.backgroundColor = 'transparent';
    setSelected(colors[23]); renderPixels(); applyTransform(); setupNickname(); setupFirebase();
  </script>
</body>
</html>
